<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 2025 | Telemetria de Voltas Rápidas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">Formula 1 2025</p>
        <h1>Tela de Telemetria</h1>
        <p>
          Compare o melhor tempo de volta de <strong>3 simuladores</strong> por pista,
          com ranking automático e destaque da volta mais rápida.
        </p>
      </header>

      <section class="card controls">
        <label for="track-select">Pista</label>
        <select id="track-select" aria-label="Selecionar pista"></select>
      </section>

      <section class="grid">
        <article class="card">
          <h2>Voltas dos Simuladores</h2>
          <table>
            <thead>
              <tr>
                <th>Simulador</th>
                <th>Melhor volta</th>
                <th>Diferença</th>
              </tr>
            </thead>
            <tbody id="laps-body"></tbody>
          </table>
        </article>

        <article class="card summary">
          <h2>Resumo da Pista</h2>
          <p><span>Pista:</span> <strong id="selected-track"></strong></p>
          <p><span>Mais rápido:</span> <strong id="best-sim"></strong></p>
          <p><span>Tempo recorde:</span> <strong id="best-lap"></strong></p>
        </article>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
